services:
  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/backend.Dockerfile
      args:
        INSTALL_VIDEO_DEPS: ${INSTALL_VIDEO_DEPS:-false}
    image: safetyraise-backend:latest
    restart: unless-stopped
    init: true
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1536m}
    cpus: ${BACKEND_CPU_LIMIT:-2}
    pids_limit: ${BACKEND_PIDS_LIMIT:-256}
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"
    env_file:
      - ../../.env.server
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      WORKFLOW_CONFIG_PATH: /app/backend/config/workflow.server.yaml
      OMP_NUM_THREADS: ${BACKEND_MATH_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${BACKEND_MATH_THREADS:-2}
      MKL_NUM_THREADS: ${BACKEND_MATH_THREADS:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${BACKEND_DATA_HOST_PATH:-/srv/safetyraise/runtime}:/app/backend/data
      - ${KBASE_HOST_PATH:-/srv/safetyraise/kbase}:/opt/ts-analysis/kbase:ro
      - ${MODELS_HOST_PATH:-/srv/safetyraise/models}:/opt/ts-analysis/models:ro

  frontend:
    build:
      context: ../..
      dockerfile: deployment/docker/frontend.Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
    image: safetyraise-frontend:latest
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-128m}
    cpus: ${FRONTEND_CPU_LIMIT:-0.5}
    pids_limit: ${FRONTEND_PIDS_LIMIT:-64}
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      - ${FRONTEND_NGINX_HOST_PATH:-/srv/safetyraise/nginx}:/etc/nginx/conf.d:ro
      - ${LETSENCRYPT_CONF_HOST_PATH:-/srv/safetyraise/letsencrypt/conf}:/etc/letsencrypt:ro
      - ${LETSENCRYPT_WWW_HOST_PATH:-/srv/safetyraise/letsencrypt/www}:/var/www/certbot:ro
