<svg width="1600" height="640" viewBox="0 0 1600 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SafetyRAISE</title>
  <desc id="desc">道路交通事故分析报告生成系统：整理资料、核对事实、查看报告。</desc>
  <defs>
    <clipPath id="frame">
      <rect width="1600" height="640" rx="24"/>
    </clipPath>
    <linearGradient id="fade" x1="880" y1="0" x2="1040" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <mask id="sketch-fade" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="640">
      <rect width="1600" height="640" fill="url(#fade)"/>
    </mask>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="640" fill="#1E3A8A"/>

    <!-- 事故现场示意图：与登录页品牌区同一几何，放大后道路延伸出画面 -->
    <g mask="url(#sketch-fade)">
      <g transform="translate(820 -40) scale(2.2)" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
        <g stroke="#FFFFFF" stroke-opacity="0.74" stroke-width="1.5">
          <path d="M0 110H164Q180 110 180 94V-40"/>
          <path d="M260 -40V94Q260 110 276 110H440"/>
          <path d="M0 190H164Q180 190 180 206V340"/>
          <path d="M260 340V206Q260 190 276 190H440"/>
        </g>
        <path d="M0 150H124M290 150H440M220 -40V96M220 222V340" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="14 10"/>
        <path d="M168 152V188M222 214H258" stroke="#FFFFFF" stroke-opacity="0.74" stroke-width="3"/>
        <g fill="#FFFFFF" fill-opacity="0.3">
          <rect x="132" y="116" width="22" height="5" rx="1"/>
          <rect x="132" y="126" width="22" height="5" rx="1"/>
          <rect x="132" y="136" width="22" height="5" rx="1"/>
          <rect x="132" y="146" width="22" height="5" rx="1"/>
          <rect x="132" y="156" width="22" height="5" rx="1"/>
          <rect x="132" y="166" width="22" height="5" rx="1"/>
          <rect x="132" y="176" width="22" height="5" rx="1"/>
        </g>
        <path d="M168 140V152M231 140V160" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="2 4"/>
        <path d="M168 136H231M168 131V141M231 131V141" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1"/>
        <text x="199.5" y="126" fill="#FFFFFF" fill-opacity="0.74" font-size="10" text-anchor="middle">12.6 m</text>
        <!-- 行驶轨迹，末端箭头指向行驶方向 -->
        <g stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.2">
          <path d="M24 170H186M242 290V206" stroke-dasharray="3 5"/>
          <path d="M181 166.5L186 170L181 173.5M238.5 211L242 206L245.5 211" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <!-- 碰撞点画在车辆下层，避免虚线压住编号 -->
        <circle cx="232" cy="168" r="18" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 3"/>
        <!-- 1 号车向东，2 号车向北；车窗朝向行驶方向 -->
        <rect x="192" y="161" width="38" height="18" rx="4" fill="#FFFFFF"/>
        <rect x="219" y="163.5" width="6" height="13" rx="1.5" fill="#1E3A8A"/>
        <rect x="195.5" y="164" width="3.5" height="12" rx="1" fill="#1E3A8A"/>
        <text x="208.5" y="174" fill="#1E3A8A" font-size="10" font-weight="700" text-anchor="middle">1</text>
        <rect x="233" y="164" width="18" height="36" rx="4" fill="#FFFFFF"/>
        <rect x="235.5" y="167.5" width="13" height="6" rx="1.5" fill="#1E3A8A"/>
        <rect x="236" y="193" width="12" height="3.5" rx="1" fill="#1E3A8A"/>
        <text x="242" y="187" fill="#1E3A8A" font-size="10" font-weight="700" text-anchor="middle">2</text>
      </g>
    </g>

    <!-- 指北针 -->
    <g stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1532 92V48M1520 62L1532 48L1544 62"/>
    </g>
    <text x="1532" y="120" fill="#FFFFFF" fill-opacity="0.74" font-size="20" font-weight="600" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">N</text>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', sans-serif">
    <text x="112" y="124" fill="#FFFFFF" fill-opacity="0.6" font-size="20" font-weight="600" letter-spacing="5">ROAD ACCIDENT ANALYSIS REPORT SYSTEM</text>
    <text x="108" y="218" fill="#FFFFFF" font-size="88" font-weight="700" letter-spacing="-1">SafetyRAISE</text>
    <text x="112" y="278" fill="#FFFFFF" font-size="36" font-weight="600" letter-spacing="2">道路交通事故分析报告生成系统</text>

    <!-- 流程与工作台阶段同名同序 -->
    <path d="M132 362V380M132 420V438" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 4"/>
    <g>
      <circle cx="132" cy="341" r="20" stroke="#FFFFFF" stroke-width="2"/>
      <text x="132" y="349" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">1</text>
      <text x="172" y="350" fill="#FFFFFF" font-size="27" font-weight="700">整理资料</text>
      <text x="310" y="349" fill="#FFFFFF" fill-opacity="0.8" font-size="22">图片与视频分组上传</text>
    </g>
    <g>
      <circle cx="132" cy="399" r="20" stroke="#FFFFFF" stroke-width="2"/>
      <text x="132" y="407" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">2</text>
      <text x="172" y="408" fill="#FFFFFF" font-size="27" font-weight="700">核对事实</text>
      <text x="310" y="407" fill="#FFFFFF" fill-opacity="0.8" font-size="22">生成结构化事故信息，人工确认</text>
    </g>
    <g>
      <circle cx="132" cy="457" r="20" stroke="#FFFFFF" stroke-width="2"/>
      <text x="132" y="465" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="middle">3</text>
      <text x="172" y="466" fill="#FFFFFF" font-size="27" font-weight="700">查看报告</text>
      <text x="310" y="465" fill="#FFFFFF" fill-opacity="0.8" font-size="22">专家意见、检索增强、审查修订与导出</text>
    </g>

    <g font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">
      <rect x="112" y="514" width="208" height="48" rx="6" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
      <text x="216" y="545">FastAPI + React</text>
      <rect x="336" y="514" width="168" height="48" rx="6" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
      <text x="420" y="545">Hybrid RAG</text>
      <rect x="520" y="514" width="200" height="48" rx="6" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
      <text x="620" y="545">Report Harness</text>
      <rect x="736" y="514" width="256" height="48" rx="6" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 5"/>
      <text x="864" y="545" fill-opacity="0.85">YOLO 视频链路 · 可选</text>
    </g>
  </g>
</svg>
