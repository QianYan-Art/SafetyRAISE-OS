name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 为最低支持版本，3.12 与官方后端镜像一致。
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: safetyraise_harness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d safetyraise_harness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 一次性 CI 数据库，仅监听回环地址；测试拒绝连接业务库。
      REPORT_HARNESS_TEST_DSN: host=127.0.0.1 port=5432 dbname=safetyraise_harness_test user=postgres password=ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run tests
        run: python -m pytest -q backend/tests

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f deployment/docker/backend.Dockerfile -t safetyraise-backend:ci .
      - name: Import backend in image
        run: docker run --rm safetyraise-backend:ci python -c "import app.main"
      - name: Build frontend image
        run: docker build -f deployment/docker/frontend.Dockerfile -t safetyraise-frontend:ci .
